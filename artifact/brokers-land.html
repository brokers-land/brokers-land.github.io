/* Layout: survey sheet — a contour-lined hero over a plot grid; every listing reads like a deed summary (ไร่-งาน-ตร.ว.) */
:root {
  --paper: #f5f7f2;
  --sheet: #ffffff;
  --ink: #18241c;
  --ink-2: #4d5c52;
  --line: #dde4dc;
  --field: #2b6a45;
  --field-ink: #ffffff;
  --field-soft: #e4efe7;
  --ochre: #9a6614;
  --ok: #23824f;
  --hold: #b06d0b;
  --sold: #a3392d;
  --contour: rgba(255,255,255,.13);
  --shadow: 0 1px 2px rgba(24,36,28,.06), 0 6px 20px rgba(24,36,28,.06);
  --f-display: 'Anuphan', 'IBM Plex Sans Thai', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans Thai', 'Anuphan', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {

    --paper: #101612; --sheet: #172019; --ink: #e5ece6; --ink-2: #a3b2a7; --line: #2a362d;
    --field: #4fa673; --field-ink: #0d1510; --field-soft: #1d3125; --ochre: #e0a94f;
    --ok: #5cc28a; --hold: #e8a03a; --sold: #e27565; --contour: rgba(0,0,0,.18);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101612; --sheet: #172019; --ink: #e5ece6; --ink-2: #a3b2a7; --line: #2a362d;
  --field: #4fa673; --field-ink: #0d1510; --field-soft: #1d3125; --ochre: #e0a94f;
  --ok: #5cc28a; --hold: #e8a03a; --sold: #e27565; --contour: rgba(0,0,0,.18);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.65; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.3; text-wrap: balance; margin: 0; }
a { color: var(--field); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--field); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-2); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--sheet); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; display: block; }
.brand small { color: var(--ink-2); font-size: .8rem; display: block; line-height: 1.2; }
.top nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--field); background: var(--field); color: var(--field-ink); border-radius: 10px; padding: 8px 16px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: .95rem; white-space: nowrap; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--field); }
.btn.ghost:hover { background: var(--field-soft); filter: none; }
.btn.sm { padding: 4px 10px; font-size: .85rem; border-radius: 8px; }
.btn.danger { background: transparent; color: var(--sold); border-color: color-mix(in srgb, var(--sold) 45%, transparent); }
.btn.danger.armed { background: var(--sold); color: #fff; }

/* hero */
.hero { background: var(--field); color: var(--field-ink); position: relative; overflow: hidden; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .wrap { position: relative; padding-block: 48px 40px; }
.hero h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); max-width: 20ch; }
.hero p { max-width: 60ch; opacity: .9; margin: 10px 0 0; }
.search { margin-top: 24px; display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 8px; background: var(--sheet); color: var(--ink); padding: 8px; border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.18); }
.search input, .search select { border: 0; background: var(--paper); border-radius: 9px; padding: 10px 12px; min-width: 0; }
.stats { display: flex; gap: 32px; margin-top: 24px; flex-wrap: wrap; }
.stats b { font-family: var(--f-display); font-size: 1.7rem; display: block; line-height: 1.1; }
.stats span { font-size: .85rem; opacity: .85; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 20px 12px; }
.bar label { font-size: .85rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.bar select, .bar input { border: 1px solid var(--line); background: var(--sheet); border-radius: 9px; padding: 6px 10px; min-width: 0; }
.bar input { width: 110px; }
.bar .count { margin-left: auto; color: var(--ink-2); font-size: .9rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; padding-bottom: 40px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform .15s ease; }
.card:hover { transform: translateY(-2px); }
.thumb { position: relative; aspect-ratio: 16 / 10; background: var(--field-soft); max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg { width: 100%; height: 100%; display: block; }
.chip { position: absolute; top: 10px; left: 10px; font-size: .75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: #fff; font-family: var(--f-display); }
.chip.available { background: var(--ok); } .chip.reserved { background: var(--hold); } .chip.sold { background: var(--sold); }
.chip.static { position: static; display: inline-block; }
.tag { position: absolute; top: 10px; right: 10px; font-size: .72rem; padding: 2px 9px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; }

.card-b h3 { font-size: 1.05rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.loc { font-size: .9rem; color: var(--ink-2); }
.deed { display: flex; align-items: baseline; gap: 8px; font-size: .9rem; color: var(--ink-2); flex-wrap: wrap; }
.deed .num { color: var(--ink); font-size: 1rem; }
.price { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.price b { font-family: var(--f-display); font-size: 1.2rem; color: var(--field); }
.price small { color: var(--ochre); }
.empty { text-align: center; padding: 48px 16px; background: var(--sheet); border: 1px dashed var(--line); border-radius: var(--r); color: var(--ink-2); grid-column: 1 / -1; }

/* detail */
.crumbs { padding-block: 18px 6px; font-size: .9rem; }
.crumbs a { text-decoration: none; }
.dhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; }
.dhead h1 { font-size: clamp(1.4rem, 3vw, 2rem); margin-top: 6px; }
.dprice { text-align: right; }
.dprice b { font-family: var(--f-display); font-size: 1.8rem; color: var(--field); display: block; }
.dprice small { color: var(--ochre); }
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; padding-bottom: 48px; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }

.desc { white-space: pre-line; }

.coords { font-family: var(--f-mono); font-size: .9rem; }

.tablewrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }

table.list select { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 4px 6px; }

.form { display: grid; gap: 14px; }
.form .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.form .cols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form label { display: grid; gap: 4px; font-weight: 500; font-size: .92rem; min-width: 0; }
.form label.check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
.form input:not([type=checkbox]):not([type=file]), .form select, .form textarea { border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 9px 11px; width: 100%; min-width: 0; }
.form .hint { font-size: .82rem; color: var(--ink-2); font-weight: 400; }

.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 10px; z-index: 20; box-shadow: var(--shadow); }

  .contact { position: static; }
}
@media (max-width: 640px) {

  .search input { grid-column: 1 / -1; }
  .search .btn { grid-column: 1 / -1; }
  .brand small { display: none; }
  .form .cols, .form .cols.two { grid-template-columns: 1fr; }
  .area { grid-template-columns: repeat(3, 1fr); }
  .area div:last-child { grid-column: 1 / -1; }
  .dprice { text-align: left; }
  .bar input { width: 92px; }
  .bar .count { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }

      if (q && [l.title, l.province, l.district, l.subdistrict, l.address, l.desc, l.type].join(' ').toLowerCase().indexOf(q) < 0) return false;

      '<p class="muted" style="font-size:.9rem;padding-bottom:40px">การเปลี่ยนสถานะ ลบ หรือบันทึก จะอัปเดตหน้าเว็บทันทีสำหรับทุกคนที่เปิดลิงก์นี้</p>';
  }

  function blankLand() { return { id: null, title: '', type: '', deed: '', province: '', district: '', subdistrict: '', address: '', rai: 0, ngan: 0, wa: 0, price: 0, road: '', utilities: '', desc: '', lat: '', lng: '', status: 'available', featured: false, published: true, images: [] }; }
  function field(id, label, val, extra) { return '<label for="' + id + '">' + label + '<input id="' + id + '" value="' + esc(val == null ? '' : val) + '" ' + (extra || '') + '></label>'; }
  function sel(id, label, list, cur) { return '<label for="' + id + '">' + label + '<select id="' + id + '">' + opts(list, cur, '- เลือก -') + '</select></label>'; }

  function landForm() {
    var d = ui.draft;
    var imgs = d.images.map(function (s, i) {
      return '<figure><img src="' + safeImg(s) + '" alt="">' + (i === 0 ? '<span class="cover">รูปปก</span>' : '') + '<figcaption>' +
        (i ? '<button type="button" class="btn ghost sm" data-cover="' + i + '">ตั้งเป็นปก</button>' : '') + '<button type="button" class="btn danger sm" data-rmimg="' + i + '">ลบ</button></figcaption></figure>';
    }).join('');
    return '<form class="formgrid" id="landform"><div class="form">' +
      '<div class="panel form"><h2>' + (d.id ? 'แก้ไขประกาศ <span class="num muted">' + code(d) + '</span>' : 'เพิ่มประกาศที่ดิน') + '</h2>' +
      field('l-title', 'ชื่อประกาศ *', d.title, 'required maxlength="200" placeholder="เช่น ที่ดินเปล่าติดถนนใหญ่ ใกล้ตัวเมือง"') +
      '<div class="cols two">' + sel('l-type', 'ประเภทที่ดิน', TYPES, d.type) + sel('l-deed', 'เอกสารสิทธิ์', DEEDS, d.deed) + '</div></div>' +
      '<div class="panel form"><h2>ขนาดและราคา</h2><div class="cols">' +
      field('l-rai', 'ไร่', d.rai, 'type="number" min="0" step="1" data-calc') +
      field('l-ngan', 'งาน (0–3)', d.ngan, 'type="number" min="0" max="3" step="1" data-calc') +
      field('l-wa', 'ตารางวา (0–99)', d.wa, 'type="number" min="0" max="99.99" step="0.01" data-calc') + '</div>' +
      field('l-price', 'ราคาขายรวม (บาท)', d.price || '', 'type="number" min="0" step="1" placeholder="เว้นว่าง = สอบถามราคา" data-calc') +
      '<div class="calc" id="calc" aria-live="polite"></div></div>' +
      '<div class="panel form"><h2>ที่ตั้ง</h2><div class="cols">' +
      field('l-province', 'จังหวัด', d.province) + field('l-district', 'อำเภอ/เขต', d.district) + field('l-subdistrict', 'ตำบล/แขวง', d.subdistrict) + '</div>' +
      field('l-address', 'ถนน / ซอย / จุดสังเกต', d.address) +
      '<label for="l-gmaps">พิกัดจาก Google Maps<span class="hint">วางลิงก์ Google Maps หรือพิกัดแบบ 13.7563, 100.5018 แล้วระบบจะแยกละติจูด/ลองจิจูดให้</span><input id="l-gmaps" placeholder="วางลิงก์หรือพิกัดที่นี่"></label>' +
      '<div class="cols two">' + field('l-lat', 'ละติจูด', d.lat, 'type="number" step="any"') + field('l-lng', 'ลองจิจูด', d.lng, 'type="number" step="any"') + '</div></div>' +
      '<div class="panel form"><h2>รายละเอียดเพิ่มเติม</h2>' +
      field('l-road', 'ทางเข้า-ออก / หน้ากว้าง', d.road, 'placeholder="เช่น ติดถนนลาดยาง หน้ากว้าง 40 ม."') +
      field('l-utilities', 'สาธารณูปโภค', d.utilities, 'placeholder="เช่น ไฟฟ้า, ประปา"') +
      '<label for="l-desc">คำอธิบาย<textarea id="l-desc" rows="6">' + esc(d.desc) + '</textarea></label></div>' +
      '<div class="panel form"><h2>รูปภาพ</h2><label for="l-files">เพิ่มรูป<span class="hint">ระบบย่อรูปให้อัตโนมัติ รูปแรกคือรูปปก</span><input id="l-files" type="file" accept="image/*" multiple></label>' +
      (imgs ? '<div class="imgs">' + imgs + '</div>' : '<p class="muted" style="margin:0">ยังไม่มีรูป หน้าเว็บจะแสดงผังแปลงแทน</p>') + '</div>' +
      '</div><div><div class="panel form contact"><h2>การเผยแพร่</h2>' +
      '<label for="l-status">สถานะ<select id="l-status">' + Object.keys(STATUS).map(function (k) { return '<option value="' + k + '"' + (d.status === k ? ' selected' : '') + '>' + STATUS[k] + '</option>'; }).join('') + '</select></label>' +
      '<label class="check"><input type="checkbox" id="l-published"' + (d.published ? ' checked' : '') + '> แสดงบนหน้าเว็บ</label>' +
      '<label class="check"><input type="checkbox" id="l-featured"' + (d.featured ? ' checked' : '') + '> ประกาศแนะนำ (ขึ้นก่อน)</label>' +
      '<button class="btn" type="submit"' + (ui.busy ? ' disabled' : '') + '>' + (ui.busy ? 'กำลังบันทึก…' : 'บันทึกและเผยแพร่') + '</button>' +
      '<button class="btn ghost" type="button" data-cancel>ยกเลิก</button></div></div></form>';
  }

  function siteForm() {
    return '<form class="formgrid" id="siteform"><div class="form">' +
      '<div class="panel form"><h2>ข้อมูลเว็บไซต์</h2>' +
      field('s-siteName', 'ชื่อเว็บไซต์ / ชื่อบริษัท', S.siteName, 'required maxlength="80"') + field('s-tagline', 'สโลแกน', S.tagline, 'maxlength="120"') +
      field('s-heroTitle', 'หัวข้อใหญ่หน้าแรก', S.heroTitle, 'maxlength="120"') +
      '<label for="s-heroSub">ข้อความใต้หัวข้อ<textarea id="s-heroSub" rows="3">' + esc(S.heroSub) + '</textarea></label>' +
      '<label for="s-about">เกี่ยวกับเรา (ท้ายเว็บ)<textarea id="s-about" rows="3">' + esc(S.about) + '</textarea></label></div>' +
      '<div class="panel form"><h2>ช่องทางติดต่อ</h2><div class="cols two">' +
      field('s-phone', 'เบอร์โทร', S.phone) + field('s-line', 'LINE ID', S.line, 'placeholder="@yourline"') +
      field('s-email', 'อีเมล', S.email, 'type="email"') + field('s-facebook', 'ลิงก์ Facebook', S.facebook, 'type="url" placeholder="https://facebook.com/..."') + '</div>' +
      field('s-address', 'ที่อยู่สำนักงาน', S.address) + '</div></div>' +
      '<div><div class="panel form contact"><h2>การแสดงผล</h2>' +
      '<label class="check"><input type="checkbox" id="s-showPrice"' + (showPrice() ? ' checked' : '') + '> แสดงราคาบนหน้าเว็บ</label>' +
      '<span class="hint muted" style="font-size:.85rem">ถ้าไม่เลือก ทุกประกาศจะแสดง "สอบถามราคา"</span>' +
      '<button class="btn" type="submit"' + (ui.busy ? ' disabled' : '') + '>' + (ui.busy ? 'กำลังบันทึก…' : 'บันทึกการตั้งค่า') + '</button></div></div></form>';
  }

  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function readDraft() {
    var d = ui.draft; if (!d) return;
    if (!document.getElementById('l-title')) return;
    d.title = val('l-title').slice(0, 200); d.type = val('l-type'); d.deed = val('l-deed');
    d.rai = Math.max(0, Math.floor(n(val('l-rai')))); d.ngan = Math.min(3, Math.max(0, Math.floor(n(val('l-ngan'))))); d.wa = Math.min(99.99, Math.max(0, n(val('l-wa'))));
    d.price = Math.max(0, n(val('l-price')));
    d.province = val('l-province'); d.district = val('l-district'); d.subdistrict = val('l-subdistrict'); d.address = val('l-address');
    var la = val('l-lat'), lo = val('l-lng');
    d.lat = la === '' ? '' : n(la); d.lng = lo === '' ? '' : n(lo);
    d.road = val('l-road'); d.utilities = val('l-utilities');
    d.desc = (document.getElementById('l-desc').value || '').slice(0, 8000);
    d.status = STATUS[val('l-status')] ? val('l-status') : 'available';
    d.published = document.getElementById('l-published').checked; d.featured = document.getElementById('l-featured').checked;
  }
  function updateCalc() {
    var c = document.getElementById('calc'); if (!c) return;
    var l = { rai: n(val('l-rai')), ngan: n(val('l-ngan')), wa: n(val('l-wa')), price: n(val('l-price')) };
    var w = totalWa(l), s = 'รวม ' + fmt(w, 2) + ' ตร.ว. (' + fmt(w * 4, 2) + ' ตร.ม. หรือ ' + fmt(w / 400, 2) + ' ไร่)';
    if (w && l.price) s += ' · เฉลี่ย ' + fmt(l.price / w) + ' บ./ตร.ว. · ' + fmt(l.price / w * 400) + ' บ./ไร่';
    c.textContent = s;
  }

  // ย่อรูปให้ไม่เกิน 1400px แล้วเก็บเป็น JPEG ในหน้าเว็บ
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1400, s = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('อ่านรูปไม่ได้')); };
      img.src = url;
    });
  }

  // ---------- บันทึก (เผยแพร่หน้าใหม่) ----------
  function jsonForHtml(o) { return JSON.stringify(o).replace(/</g, '\\u003c').replace(/[\u2028\u2029]/g, function (c) { return c === '\u2028' ? '\\u2028' : '\\u2029'; }); }
  function buildHtml(state) {
    var css = document.getElementById('app-css').textContent;
    var js = document.getElementById('app-js').textContent;
    var fonts = 'https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap';
    var SC = '<' + '/script>';
    return SKELETON + '<title>' + esc(state.settings.siteName || 'Brokers Land') + '</title>\n' +
      '<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link rel="stylesheet" href="' + fonts + '">\n' +
      '<style id="app-css">' + css + '</style>\n<div id="app"></div>\n' +
      '<script type="application/json" id="app-data">' + jsonForHtml(state) + SC + '\n' +
      '<script id="app-js">' + js + SC + '\n</body></html>';
  }

  function save(nextState, doneMsg, after) {
    if (!artifactApi) { ui.error = 'ยังเชื่อมต่อระบบบันทึกไม่ได้ ลองรีเฟรชหน้าอีกครั้ง'; render(); return; }
    var html = buildHtml(nextState);
    if (new Blob([html]).size > MAX_BYTES) { ui.error = 'หน้าเว็บใหญ่เกิน 16 MB ลองลบรูปบางรูปหรือลดจำนวนรูปต่อประกาศ'; render(); return; }
    ui.busy = true; ui.error = ''; render();
    try { sessionStorage.setItem('bl-after', JSON.stringify({ msg: doneMsg, hash: after || '#admin' })); } catch (e) {}
    artifactApi.publish(html).then(function () {
      // หน้าเว็บจะรีโหลดเป็นเวอร์ชันใหม่เอง
    }, function (err) {
      ui.busy = false;
      var c = err && err.code;
      try { sessionStorage.removeItem('bl-after'); } catch (e) {}
      if (c === 'conflict') { toast('มีการแก้ไขจากอีกที่หนึ่ง กำลังโหลดเวอร์ชันล่าสุด'); return; }
      if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') { ui.readOnly = true; ui.error = ''; }
      else if (c === 'too_large') ui.error = 'หน้าเว็บใหญ่เกินขนาดที่บันทึกได้ ลองลบรูปบางรูป';
      else if (c === 'rate_limited') ui.error = 'บันทึกถี่เกินไป รอสักครู่แล้วลองใหม่';
      else ui.error = 'บันทึกไม่สำเร็จ ลองอีกครั้ง';
      render();
    });
  }
  function cloneState() { return JSON.parse(JSON.stringify(STATE)); }

  // ---------- events ----------
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'search') {
      ui.q = val('f-q'); ui.province = val('f-province'); ui.type = val('f-type');
      refreshResults(); var r = document.getElementById('results'); if (r) r.scrollIntoView({ behavior: 'smooth' });
    } else if (e.target.id === 'landform') {
      readDraft(); var d = ui.draft;
      if (!d.title) { ui.error = 'กรุณากรอกชื่อประกาศ'; render(); return; }
      var next = cloneState(), item = JSON.parse(JSON.stringify(d));
      item.updated = today(); delete item.sample;
      if (!item.id) { item.id = next.nextId++; next.lands.push(item); }
      else next.lands = next.lands.map(function (x) { return x.id === item.id ? item : x; });
      save(next, 'บันทึกประกาศแล้ว', '#admin');
    } else if (e.target.id === 'siteform') {
      var next2 = cloneState(), s = next2.settings;
      ['siteName', 'tagline', 'heroTitle', 'phone', 'line', 'email', 'facebook', 'address'].forEach(function (k) { s[k] = val('s-' + k).slice(0, 300); });
      s.heroSub = document.getElementById('s-heroSub').value.trim().slice(0, 600);
      s.about = document.getElementById('s-about').value.trim().slice(0, 1500);
      s.showPrice = document.getElementById('s-showPrice').checked;
      if (s.facebook && !/^https:\/\//i.test(s.facebook)) s.facebook = '';
      if (!s.siteName) s.siteName = 'Brokers Land';
      ui.tab = 'site';
      try { sessionStorage.setItem('bl-tab', 'site'); } catch (er) {}
      save(next2, 'บันทึกการตั้งค่าแล้ว', '#admin');
    }
  });

  function refreshResults() { var r = document.getElementById('results'); if (r) r.innerHTML = resultsHtml(); }
  app.addEventListener('change', function (e) {
    var t = e.target;
    var map = { 'f-status': 'status', 'f-minP': 'minP', 'f-maxP': 'maxP', 'f-minR': 'minR', 'f-maxR': 'maxR', 'f-sort': 'sort', 'f-province': 'province', 'f-type': 'type' };
    if (map[t.id]) { ui[map[t.id]] = t.value; refreshResults(); return; }
    if (t.dataset.status) {
      var next = cloneState(), id = Number(t.dataset.status);
      next.lands.forEach(function (l) { if (l.id === id) { l.status = t.value; l.updated = today(); } });
      save(next, 'เปลี่ยนสถานะแล้ว', '#admin');
      return;
    }
    if (t.id === 'l-files' && t.files && t.files.length) {
      readDraft();
      var files = Array.prototype.slice.call(t.files).filter(function (f) { return /^image\//.test(f.type); });
      Promise.all(files.map(shrink)).then(function (list) { ui.draft.images = ui.draft.images.concat(list); render(); }, function () { ui.error = 'มีรูปที่อ่านไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG'; render(); });
    }
  });
  app.addEventListener('input', function (e) {
    if (e.target.hasAttribute('data-calc')) updateCalc();
    if (e.target.id === 'l-gmaps') {
      var v = e.target.value, m = /@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(v) || /(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/.exec(v);
      if (m) { document.getElementById('l-lat').value = Number(m[1]).toFixed(6); document.getElementById('l-lng').value = Number(m[2]).toFixed(6); }
    }
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button, a'); if (!b) return;
    if (b.dataset.gal != null) {
      var src = b.querySelector('img').src, main = document.getElementById('gal-main');
      main.innerHTML = '<img src="' + src + '" alt="">';
      Array.prototype.forEach.call(document.querySelectorAll('.gal-thumbs button'), function (x) { x.setAttribute('aria-current', String(x === b)); });
      return;
    }
    if (b.dataset.copy != null) {
      var text = b.dataset.copy;
      var done = function () { b.textContent = 'คัดลอกแล้ว'; setTimeout(function () { b.textContent = 'คัดลอก'; }, 1500); };
      var fallback = function () { var r = document.createRange(), el = b.parentNode.querySelector('b'); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('เลือกข้อความแล้ว กดคัดลอกได้เลย'); };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (er) { fallback(); }
      return;
    }
    if (b.dataset.tab) { ui.tab = b.dataset.tab; ui.edit = null; ui.error = ''; render(); return; }
    if (b.dataset.edit) {
      ui.edit = b.dataset.edit; ui.error = '';
      ui.draft = b.dataset.edit === 'new' ? blankLand() : JSON.parse(JSON.stringify(findLand(Number(b.dataset.edit))));
      render(); window.scrollTo(0, 0); return;
    }
    if (b.hasAttribute('data-cancel')) { ui.edit = null; ui.draft = null; ui.error = ''; render(); return; }
    if (b.dataset.del) {
      if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'ยืนยันลบ'; setTimeout(function () { if (b.isConnected) { b.classList.remove('armed'); b.textContent = 'ลบ'; } }, 4000); return; }
      var id = Number(b.dataset.del), next = cloneState();
      next.lands = next.lands.filter(function (l) { return l.id !== id; });
      save(next, 'ลบประกาศแล้ว', '#admin'); return;
    }
    if (b.dataset.cover) { readDraft(); var i = Number(b.dataset.cover), im = ui.draft.images.splice(i, 1)[0]; ui.draft.images.unshift(im); render(); return; }
    if (b.dataset.rmimg) { readDraft(); ui.draft.images.splice(Number(b.dataset.rmimg), 1); render(); return; }
  });

  window.addEventListener('hashchange', function () { ui.edit = null; ui.error = ''; render(); window.scrollTo(0, 0); });
  window.addEventListener('resize', function () { if (route().view === 'home') drawContours(); });

  // ---------- start ----------
  render();
  try {
    var after = JSON.parse(sessionStorage.getItem('bl-after') || 'null');
    var tab = sessionStorage.getItem('bl-tab');
    sessionStorage.removeItem('bl-after'); sessionStorage.removeItem('bl-tab');
    if (tab) ui.tab = tab;
    if (after) { if (after.hash && location.hash !== after.hash) location.hash = after.hash; setTimeout(function () { toast(after.msg); }, 300); }
  } catch (e) {}

  var C = window.claude;
  if (C && C.use) {
    Promise.all([C.use('user').catch(function () { return null; }), C.use('artifact').catch(function () { return null; })]).then(function (r) {
      var user = r[0]; artifactApi = r[1];
      if (!user || !artifactApi) return;
      return user.canEdit().then(function (ok) { if (ok) { canAdmin = true; render(); } });
    }).catch(function () {});
  }
})();
</script>
