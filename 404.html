<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Brokers Land</title>
  <script>
    // ถ้าเปิดลิงก์ที่ไม่มี /docs/ ให้พาไปหน้าเดียวกันในโฟลเดอร์ docs
    (function () {
      var m = location.pathname.match(/^\/([^\/]+)\/(.*)$/);
      if (m && m[2].indexOf('docs/') !== 0) location.replace('/' + m[1] + '/docs/' + m[2] + location.search + location.hash);
    })();
  </script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:48px 16px">
  <p>ไม่พบหน้านี้</p>
  <p><a id="home" href="/">กลับหน้าแรก</a></p>
  <script>var p = location.pathname.split('/')[1]; if (p && location.hostname.slice(-10) === '.github.io') document.getElementById('home').href = '/' + p + '/docs/';</script>
</body>
</html>
